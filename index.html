<!doctype html>
<html lang="en" dir="auto">
    <head>
        <meta charset="UTF-8" />
        <!-- The tab icon is Deriv's mark - the red square and its "d" - which is
             what the platform this trades on puts in its own tab, and what the
             reference screenshot shows. It was /logo.png, the MaziwaTrader
             lockup: a 1240px artwork with a wordmark and a tagline in it, which
             at the 16px a tab gives it collapsed into an unreadable dark smudge.
             The SVG is first so every browser that can take one draws it at
             whatever size it needs; the PNG behind it is the fallback for those
             that cannot, and is the app's own logo rather than nothing. -->
        <link rel="icon" type="image/svg+xml" href="/deriv-logo.svg" />
        <link rel="icon" type="image/png" href="/logo.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

        <!-- Font loading: preconnect so the browser can open the connection before it
             even discovers the stylesheet needs it, and an explicit <link> for our own
             IBM Plex Sans (previously an @import inside the global stylesheet, which
             blocked discovery until that whole CSS file was fetched and parsed). -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <!-- Inter is the interface typeface (see the body rule in _reset.scss).
             Weights match the ones the UI actually asks for: 400 body, 500/600
             labels, 700 figures and buttons, 900 the "AI" on the floating orb.
             A weight's file is only downloaded when something on the page uses
             it. -->
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap"
        />
        <!-- Roboto is the typeface on phones (styles/index.scss, 600px and
             narrower), as in the phone reference screenshots. Android has it
             built in; this brings the same letters to every other phone.
             Wider screens never use it, so they never download it. -->
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap"
        />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css?family=IBM+Plex+Sans:300,400,500,700&display=swap&subset=cyrillic,cyrillic-ext,latin-ext,vietnamese"
        />
        <!-- IBM Plex Mono: the account console's balance/figures were declared in this
             typeface but it was never actually loaded, so every number has silently been
             rendering in the system fallback (Consolas/SFMono) instead. -->
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=IBM+Plex+Mono:600,700&display=swap" />

        <!-- PWA Manifest -->
        <link rel="manifest" href="/manifest.json" />

        <!-- PWA Meta Tags -->
        <meta name="theme-color" content="#ff444f" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="MaziwaTrader" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="msapplication-TileColor" content="#ff444f" />
        <meta name="msapplication-tap-highlight" content="no" />

        <!-- Apple Touch Icons -->
        <link rel="apple-touch-icon" href="/logo.png" />
        <link rel="apple-touch-icon" sizes="152x152" href="/logo.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="/logo.png" />
        <!-- Search and link previews. The title is the blue headline Google
             shows, the description the grey lines under it. There is no
             canonical link here on purpose: this one file is served for every
             route, so a fixed one would call every page a copy of the home
             page. The layout sets it per route instead (components/layout).
             The title follows the reference tab exactly - its own reads
             "Automate Your Trades | Dollarprinter.com" - which is why the
             domain carries its everyday spelling here rather than the brand's
             MaziwaTrader camel case. Deliberate; not a typo to tidy up. -->
        <title>Automate Your Trades | Maziwatrader.com</title>
        <meta name="title" content="Automate Your Trades | Maziwatrader.com" />
        <meta
            name="description"
            content="MaziwaTrader is a trading platform with automated trading bots, DTrader, market analysis tools, charts, copy trading and risk management tools for Deriv traders."
        />
        <!-- Indexable, which is already the default - stated so that nothing is
             left to inference. max-image-preview:large lets Google use the brand
             image at full size rather than a thumbnail; the two -1s lift its own
             caps on snippet length, which it may use or ignore. None of this
             makes Google show any particular layout - it only removes limits we
             would otherwise be imposing on it. -->
        <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="MaziwaTrader" />
        <meta property="og:locale" content="en_US" />
        <!-- The home page. Every route is served this one file, so the layout
             rewrites this per route alongside the canonical link
             (components/layout). Unlike the canonical, a stale og:url only
             mislabels a share preview, so it is safe to carry a default here. -->
        <meta property="og:url" content="https://www.maziwatrader.com/" />
        <meta property="og:title" content="Automate Your Trades | Maziwatrader.com" />
        <meta
            property="og:description"
            content="MaziwaTrader is a trading platform with automated trading bots, DTrader, market analysis tools, charts, copy trading and risk management tools for Deriv traders."
        />
        <!-- public/maziwatrader-logo-v3.png, the brand artwork already in the
             repo. Measured 1536x1024, which clears the 1200x630 that link
             previews want and is the 3:2 a large card crops to. -->
        <meta property="og:image" content="https://www.maziwatrader.com/maziwatrader-logo-v3.png" />
        <meta property="og:image:width" content="1536" />
        <meta property="og:image:height" content="1024" />
        <meta property="og:image:alt" content="MaziwaTrader" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Automate Your Trades | Maziwatrader.com" />
        <meta
            name="twitter:description"
            content="MaziwaTrader is a trading platform with automated trading bots, DTrader, market analysis tools, charts, copy trading and risk management tools for Deriv traders."
        />
        <meta name="twitter:image" content="https://www.maziwatrader.com/maziwatrader-logo-v3.png" />
        <meta name="twitter:image:alt" content="MaziwaTrader" />
        <!-- Structured data: the site name Google prints above the address,
             and the logo it can show for the brand. A data block, not a
             script, so the Content-Security-Policy in vercel.json does not
             apply to it. -->
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@graph": [
                    {
                        "@type": "WebSite",
                        "name": "MaziwaTrader",
                        "alternateName": ["Maziwa Trader", "maziwatrader.com"],
                        "url": "https://www.maziwatrader.com/"
                    },
                    {
                        "@type": "Organization",
                        "name": "MaziwaTrader",
                        "url": "https://www.maziwatrader.com/",
                        "logo": "https://www.maziwatrader.com/maziwatrader-logo-v3.png"
                    }
                ]
            }
        </script>
        <style>
            :root {
                font-size: 62.5%;
            }
        </style>
    </head>

    <body class="body theme theme--light">
        <div id="modal_root" class="modal-root"></div>
        <div id="popup_root" class="popup-root"></div>
        <div id="root"></div>
        <!--
            LiveChat script.

            CSP: script-src in vercel.json allows this by the sha256 hash of
            its exact contents, so ANY edit below - even whitespace - silently
            stops it running in production with "Executing inline script
            violates the following Content Security Policy directive". The
            browser prints the hash it wanted; put that in vercel.json.
        -->
        <script type="text/javascript" defer>
            window.__lc = window.__lc || {};
            window.__lc.license = 12049137;
            window.__lc.asyncInit = true;
            (function (n, t, c) {
                function i(n) {
                    return e._h ? e._h.apply(null, n) : e._q.push(n);
                }
                var e = {
                    _q: [],
                    _h: null,
                    _v: '2.0',
                    on: function () {
                        i(['on', c.call(arguments)]);
                    },
                    once: function () {
                        i(['once', c.call(arguments)]);
                    },
                    off: function () {
                        i(['off', c.call(arguments)]);
                    },
                    get: function () {
                        if (!e._h) throw new Error('[LiveChatWidget] You can’t use getters before load.');
                        return i(['get', c.call(arguments)]);
                    },
                    call: function () {
                        i(['call', c.call(arguments)]);
                    },
                    init: function () {
                        setTimeout(() => {
                            var n = t.createElement('script');
                            ((n.async = !0),
                                (n.type = 'text/javascript'),
                                (n.src = 'https://cdn.livechatinc.com/tracking.js'),
                                t.head.appendChild(n));
                        }, 3000);
                    },
                };
                (!n.__lc.asyncInit && e.init(), (n.LiveChatWidget = n.LiveChatWidget || e));
            })(window, document, [].slice);
        </script>
        <!-- End LiveChat script -->

        <!-- Browser Service Worker Prevention.
             Allowed by sha256 hash in vercel.json - see the note above the
             LiveChat script before editing anything in here. -->
        <script>
            // Check browser compatibility and prevent service worker issues
            const userAgent = navigator.userAgent.toLowerCase();
            const isFirefox = userAgent.includes('firefox');
            const isSafari = userAgent.includes('safari') && !userAgent.includes('chrome');
            const shouldSkipSW = isFirefox || isSafari;

            if (shouldSkipSW) {
                const browserName = isFirefox ? 'Firefox' : 'Safari';
                console.log(
                    `[HTML] ${browserName} detected - preventing service worker registration to avoid chunk loading issues`
                );

                // Cleanup any existing service workers
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker
                        .getRegistrations()
                        .then(registrations => {
                            registrations.forEach(registration => {
                                console.log(`[HTML] Unregistering existing SW for ${browserName}:`, registration.scope);
                                registration.unregister();
                            });
                        })
                        .catch(error => {
                            console.error('[HTML] Failed to cleanup service workers:', error);
                        });
                }
            }

            // Check online/offline status
            console.log('[HTML] Online status:', navigator.onLine);
            window.addEventListener('online', () => {
                console.log('[HTML] Back online');
            });
            window.addEventListener('offline', () => {
                console.log('[HTML] Gone offline');
            });

            // Listen for service worker messages if registered by PWA utils (non-problematic browsers only)
            if ('serviceWorker' in navigator && !shouldSkipSW) {
                navigator.serviceWorker.addEventListener('message', event => {
                    console.log('[HTML] Message from service worker:', event.data);
                });
            }

            // Surface CSP violations to the console with enough detail to fix them -
            // the browser's own network-panel reporting is easy to miss.
            document.addEventListener('securitypolicyviolation', event => {
                console.error(`[CSP] Blocked: ${event.violatedDirective} - ${event.blockedURI}`, {
                    sourceFile: event.sourceFile,
                    lineNumber: event.lineNumber,
                    originalPolicy: event.originalPolicy,
                });
            });
        </script>
    </body>
</html>
