<!doctype html>
<html lang="en" dir="auto">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" href="/logo.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

        <!-- Font loading: preconnect so the browser can open the connection before it
             even discovers the stylesheet needs it, and an explicit <link> for our own
             IBM Plex Sans (previously an @import inside the global stylesheet, which
             blocked discovery until that whole CSS file was fetched and parsed). -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <!-- Inter is the interface typeface (see the body rule in _reset.scss).
             Weights match the ones the UI actually asks for: 400 body, 500/600
             labels, 700 figures and buttons. -->
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css?family=IBM+Plex+Sans:300,400,500,700&display=swap&subset=cyrillic,cyrillic-ext,latin-ext,vietnamese"
        />
        <!-- IBM Plex Mono: the account console's balance/figures were declared in this
             typeface but it was never actually loaded, so every number has silently been
             rendering in the system fallback (Consolas/SFMono) instead. -->
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=IBM+Plex+Mono:600,700&display=swap" />

        <!-- PWA Manifest -->
        <link rel="manifest" href="/manifest.json" />

        <!-- PWA Meta Tags -->
        <meta name="theme-color" content="#ff444f" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="MaziwaTrader" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="msapplication-TileColor" content="#ff444f" />
        <meta name="msapplication-tap-highlight" content="no" />

        <!-- Apple Touch Icons -->
        <link rel="apple-touch-icon" href="/logo.png" />
        <link rel="apple-touch-icon" sizes="152x152" href="/logo.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="/logo.png" />
        <meta name="title" content="Automate Your Trades | MaziwaTrader" />
        <meta
            name="description"
            content="Build a trading bot without coding with MaziwaTrader. Automated trading for derivatives."
        />
        <meta property="og:title" content="MaziwaTrader" />
        <meta
            property="og:description"
            content="Build a trading bot without coding with MaziwaTrader. Automated trading for derivatives."
        />
        <title>Automate Your Trades | MaziwaTrader</title>
        <style>
            :root {
                font-size: 62.5%;
            }
        </style>
    </head>

    <body class="body theme theme--light">
        <div id="modal_root" class="modal-root"></div>
        <div id="popup_root" class="popup-root"></div>
        <div id="root"></div>
        <!--
            LiveChat script.

            CSP: script-src in vercel.json allows this by the sha256 hash of
            its exact contents, so ANY edit below - even whitespace - silently
            stops it running in production with "Executing inline script
            violates the following Content Security Policy directive". The
            browser prints the hash it wanted; put that in vercel.json.
        -->
        <script type="text/javascript" defer>
            window.__lc = window.__lc || {};
            window.__lc.license = 12049137;
            window.__lc.asyncInit = true;
            (function (n, t, c) {
                function i(n) {
                    return e._h ? e._h.apply(null, n) : e._q.push(n);
                }
                var e = {
                    _q: [],
                    _h: null,
                    _v: '2.0',
                    on: function () {
                        i(['on', c.call(arguments)]);
                    },
                    once: function () {
                        i(['once', c.call(arguments)]);
                    },
                    off: function () {
                        i(['off', c.call(arguments)]);
                    },
                    get: function () {
                        if (!e._h) throw new Error('[LiveChatWidget] You can’t use getters before load.');
                        return i(['get', c.call(arguments)]);
                    },
                    call: function () {
                        i(['call', c.call(arguments)]);
                    },
                    init: function () {
                        setTimeout(() => {
                            var n = t.createElement('script');
                            ((n.async = !0),
                                (n.type = 'text/javascript'),
                                (n.src = 'https://cdn.livechatinc.com/tracking.js'),
                                t.head.appendChild(n));
                        }, 3000);
                    },
                };
                (!n.__lc.asyncInit && e.init(), (n.LiveChatWidget = n.LiveChatWidget || e));
            })(window, document, [].slice);
        </script>
        <!-- End LiveChat script -->

        <!-- Browser Service Worker Prevention.
             Allowed by sha256 hash in vercel.json - see the note above the
             LiveChat script before editing anything in here. -->
        <script>
            // Check browser compatibility and prevent service worker issues
            const userAgent = navigator.userAgent.toLowerCase();
            const isFirefox = userAgent.includes('firefox');
            const isSafari = userAgent.includes('safari') && !userAgent.includes('chrome');
            const shouldSkipSW = isFirefox || isSafari;

            if (shouldSkipSW) {
                const browserName = isFirefox ? 'Firefox' : 'Safari';
                console.log(
                    `[HTML] ${browserName} detected - preventing service worker registration to avoid chunk loading issues`
                );

                // Cleanup any existing service workers
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker
                        .getRegistrations()
                        .then(registrations => {
                            registrations.forEach(registration => {
                                console.log(`[HTML] Unregistering existing SW for ${browserName}:`, registration.scope);
                                registration.unregister();
                            });
                        })
                        .catch(error => {
                            console.error('[HTML] Failed to cleanup service workers:', error);
                        });
                }
            }

            // Check online/offline status
            console.log('[HTML] Online status:', navigator.onLine);
            window.addEventListener('online', () => {
                console.log('[HTML] Back online');
            });
            window.addEventListener('offline', () => {
                console.log('[HTML] Gone offline');
            });

            // Listen for service worker messages if registered by PWA utils (non-problematic browsers only)
            if ('serviceWorker' in navigator && !shouldSkipSW) {
                navigator.serviceWorker.addEventListener('message', event => {
                    console.log('[HTML] Message from service worker:', event.data);
                });
            }

            // Surface CSP violations to the console with enough detail to fix them -
            // the browser's own network-panel reporting is easy to miss.
            document.addEventListener('securitypolicyviolation', event => {
                console.error(`[CSP] Blocked: ${event.violatedDirective} - ${event.blockedURI}`, {
                    sourceFile: event.sourceFile,
                    lineNumber: event.lineNumber,
                    originalPolicy: event.originalPolicy,
                });
            });
        </script>
    </body>
</html>
