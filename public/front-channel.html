<!doctype html>
<html>
    <head>
        <title>Deriv</title>
        <meta charset="utf-8" />
        <script>
            try {
                // we check if we can access the top.location, if we can't it will throw an error
                // and this means this front-channel is not rendered on the same window as the application which is logging out
                let isSameOrigin = top.location.hostname === self.location.hostname;
            } catch (err) {
                // Keep this key list in sync with clearAuthData() in
                // src/utils/auth-utils.ts - this file is a standalone static page
                // (loaded as a cross-origin iframe for OIDC front-channel logout),
                // so it can't import that function and must duplicate the list.
                localStorage.removeItem('accountsList');
                localStorage.removeItem('clientAccounts');
                localStorage.removeItem('authToken');
                localStorage.removeItem('active_loginid');
                localStorage.removeItem('client.country');
                localStorage.removeItem('client_account_details');
                localStorage.removeItem('google_access_token');
                localStorage.removeItem('google_access_token_expiry');
            }
        </script>
    </head>

    <body></body>
</html>
